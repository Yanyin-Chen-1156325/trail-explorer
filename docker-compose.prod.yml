services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: ${SUPABASE_POSTGRES_CONNECTION_STRING:?Set SUPABASE_POSTGRES_CONNECTION_STRING}
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-TrailExplorer}
      Jwt__Audience: ${JWT_AUDIENCE:-TrailExplorerAPI}
      Jwt__AccessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
      Jwt__RefreshTokenExpirationDays: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      GoogleOAuth__ClientId: ${GOOGLE_OAUTH_CLIENT_ID:?Set GOOGLE_OAUTH_CLIENT_ID}
      Cors__AllowedOrigins__0: ${FRONTEND_ALLOWED_ORIGIN:?Set FRONTEND_ALLOWED_ORIGIN}
      DocApi__BaseUrl: ${DOC_API_BASE_URL:-https://api.doc.govt.nz}
      DocApi__ApiKey: ${DOC_API_KEY:-}
      TrailSynchronisation__Enabled: ${TRAIL_SYNC_ENABLED:-false}
      TrailSynchronisation__RunOnStartup: ${TRAIL_SYNC_RUN_ON_STARTUP:-false}
      TrailSynchronisation__IntervalHours: ${TRAIL_SYNC_INTERVAL_HOURS:-24}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?Set GOOGLE_OAUTH_CLIENT_ID}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
